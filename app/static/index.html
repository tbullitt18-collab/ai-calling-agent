<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Check | Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="drop">💧</span> Rain Check
            </div>
            <div class="status-pill">System Operational</div>
        </header>

        <div class="grid">
            <!-- Voice Twins Panel -->
            <div class="card">
                <h2>Voice Twins</h2>
                <div id="voiceList">
                    <div class="voice-item">
                        <div class="voice-info">
                            <h3>Loading voices...</h3>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button class="btn" style="flex: 1;" onclick="showCloneModal()">+ New Clone</button>
                    <button class="btn btn-outline" style="flex: 1;" onclick="showLinkModal()">🔗 Link Existing</button>
                </div>
            </div>

            <!-- Call Scheduler Panel -->
            <div class="card scheduler-card">
                <h2>Schedule Call-Out</h2>
                <div class="form-group">
                    <label>Manager's Number</label>
                    <input type="text" id="managerNumber" placeholder="+1234567890">
                </div>
                <div class="form-group">
                    <label>Call Time (24h)</label>
                    <input type="time" id="callTime" value="06:00">
                </div>
                <div class="form-group">
                    <label>Reason for Absence</label>
                    <select id="callReason"
                        style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); padding: 0.8rem; border-radius: 8px; color: white;">
                        <option value="Sick Day">Sick Day</option>
                        <option value="Mental Health Day">Mental Health Day</option>
                        <option value="Personal Emergency">Personal Emergency</option>
                        <option value="Running Late">Running Late</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Additional Notes (Handover, etc.)</label>
                    <textarea id="callNotes" rows="3"
                        style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); padding: 0.8rem; border-radius: 8px; color: white; resize: none;"
                        placeholder="e.g. My keys are under the mat, tell them I'll be in at 10 AM."></textarea>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button class="btn" style="flex: 1;" onclick="scheduleCall()">Schedule</button>
                    <button class="btn btn-outline" style="flex: 1;" onclick="callNow()">Call Now</button>
                </div>



                <h2 style="margin-top: 2rem;">Upcoming Calls</h2>
                <div id="upcomingCalls">
                    <p style="color: var(--text-secondary); font-size: 0.8rem;">No calls scheduled.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Clone Modal Placeholder -->
    <div id="cloneModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background: var(--bg-color); padding: 2rem; border-radius: 20px; border: 1px solid var(--accent-blue); z-index: 100; width: 400px;">
        <h2>Create Voice Twin</h2>
        <div class="form-group">
            <label>Voice Name</label>
            <input type="text" id="voiceName" placeholder="My Professional Twin">
        </div>
        <div class="form-group">
            <label>Upload Samples (5+ mins recommended)</label>
            <input type="file" id="voiceFiles" multiple>
        </div>
        <button class="btn" onclick="startCloning()">Start Synthesis</button>
        <button class="btn btn-outline" onclick="hideCloneModal()">Cancel</button>
    </div>

    <!-- Link Existing Modal -->
    <div id="linkModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background: var(--bg-color); padding: 2rem; border-radius: 20px; border: 1px solid var(--accent-blue); z-index: 101; width: 400px; box-shadow: 0 0 50px rgba(0,0,0,0.5);">
        <h2>Link ElevenLabs Voice</h2>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 1.5rem;">
            Find your Voice ID in the <a href="https://elevenlabs.io/app/voice-lab" target="_blank"
                style="color: var(--accent-blue);">ElevenLabs Voice Lab</a>.
        </p>
        <div class="form-group">
            <label>Friendly Name</label>
            <input type="text" id="linkName" placeholder="e.g. My Personal Assistant">
        </div>
        <div class="form-group">
            <label>ElevenLabs Voice ID</label>
            <input type="text" id="linkVoiceId" placeholder="e.g. pMsXgVXv3BLzUgS... ">
        </div>
        <button class="btn" onclick="linkVoice()">Link Voice</button>
        <button class="btn btn-outline" onclick="hideLinkModal()">Cancel</button>
    </div>

    <script src="/static/js/app.js"></script>

</body>

</html>
