<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Check | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --glass-border: rgba(255, 255, 255, 0.1);
            --error-red: #f85149;
            --success-green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image:
                radial-gradient(at 30% 20%, rgba(88, 166, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(188, 140, 255, 0.08) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(88, 166, 255, 0.05);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo .drop {
            color: var(--accent-blue);
            font-size: 2.2rem;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: var(--error-red);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.2rem;
            animation: shake 0.4s ease;
        }

        .success-msg {
            color: var(--success-green);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1rem;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .toggle-link a {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .toggle-link a:hover {
            color: var(--accent-purple);
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1><span class="drop">💧</span> Rain Check</h1>
                <p id="formTitle">Sign in to your dashboard</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
                <div class="error-msg" id="loginError"></div>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" class="hidden" onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" autocomplete="username"
                        minlength="3" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" autocomplete="new-password"
                        minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Confirm your password"
                        autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
                <div class="error-msg" id="registerError"></div>
            </form>

            <!-- TOGGLE -->
            <div class="toggle-link" id="toggleLogin">
                Don't have an account? <a onclick="showRegister()">Create one</a>
            </div>
            <div class="toggle-link hidden" id="toggleRegister">
                Already have an account? <a onclick="showLogin()">Sign in</a>
            </div>

            <div class="footer">
                Secured with session-based authentication
            </div>
        </div>
    </div>

    <script>
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('toggleLogin').classList.add('hidden');
            document.getElementById('toggleRegister').classList.remove('hidden');
            document.getElementById('formTitle').textContent = 'Create your account';
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('toggleRegister').classList.add('hidden');
            document.getElementById('toggleLogin').classList.remove('hidden');
            document.getElementById('formTitle').textContent = 'Sign in to your dashboard';
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errEl.textContent = '';

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                const data = await resp.json();
                if (resp.ok) {
                    window.location.href = data.redirect || '/';
                } else {
                    errEl.textContent = data.error || 'Login failed';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                errEl.textContent = 'Network error. Is the server running?';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errEl = document.getElementById('registerError');

            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (password !== confirm) {
                errEl.textContent = "Passwords don't match";
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            errEl.textContent = '';

            try {
                const resp = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        password: password,
                        confirm_password: confirm
                    })
                });

                const data = await resp.json();
                if (resp.ok) {
                    window.location.href = data.redirect || '/';
                } else {
                    errEl.textContent = data.error || 'Registration failed';
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            } catch (err) {
                errEl.textContent = 'Network error. Is the server running?';
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>

</html>
