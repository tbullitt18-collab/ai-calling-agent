services:
  - type: web
    name: raincheck-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install setuptools>=69.0.0 && pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PORT
        value: "10000"
      - key: VONAGE_APPLICATION_ID
        sync: false
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_PRIVATE_KEY
        sync: false
      - key: VONAGE_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: "eleven_multilingual_v2"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: FLASK_ENV
        value: "production"
      - key: FLASK_SECRET_KEY
        generateValue: true
